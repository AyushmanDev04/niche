services:
  web:
    build: .
    ports:
      # gunicorn listens on $PORT inside the container (default 5000).
      - "5000:5000"
    volumes:
      # Whole-project mount for live reload during development. This is a dev
      # convenience only — the built image excludes .env, databases and the
      # local virtualenv via .dockerignore.
      - .:/app
    env_file:
      - ./.env
    environment:
      # Overrides DATABASE_URL from .env so local work never touches the
      # production database by accident.
      - DATABASE_URL=postgresql://postgres:password@db:5432/myapp
      - CORS_ORIGINS=http://localhost:5000
      - PORT=5000
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/myapp
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=myapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `depends_on` alone only waits for the container to start, not for
      # Postgres to accept connections, so the web service could race it.
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
